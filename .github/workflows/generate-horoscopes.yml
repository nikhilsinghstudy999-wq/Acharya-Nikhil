name: Generate Daily Horoscopes

on:
  schedule:
    # Runs at 5:00 AM IST (11:30 PM UTC previous day)
    - cron: '30 23 * * *'
  workflow_dispatch:  # allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Generate horoscopes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run generate

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/daily-horoscope.json
          git diff --staged --quiet || (git commit -m "🤖 Daily horoscopes update [skip ci]" && git push)

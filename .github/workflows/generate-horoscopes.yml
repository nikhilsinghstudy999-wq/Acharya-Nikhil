name: Generate Daily Horoscopes

on:
  schedule:
    - cron: '30 23 * * *'   # 5:00 AM IST
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}   # use PAT for checkout (ensures push works)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate horoscopes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-horoscopes.js

      - name: Commit and push updated JSON
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/daily-horoscope.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Daily horoscopes update [skip ci]"
            git push
          fi
        env:
          # The PAT is already used in checkout; push uses the same token
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
